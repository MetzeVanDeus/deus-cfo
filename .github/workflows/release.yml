name: Windows release artifact

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest ruff pip-audit
      - name: Ruff
        run: ruff check backend
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest backend
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend dependency audit
        run: npm audit --prefix frontend --audit-level=high
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build packaged service
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Zip and checksum artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DeusCFO -DestinationPath dist/DeusCFO-windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 dist/DeusCFO-windows-x64.zip).Hash
          "$hash  DeusCFO-windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeusCFO-windows-x64
          path: |
            dist/DeusCFO-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/DeusCFO-windows-x64.zip dist/SHA256SUMS.txt --generate-notes
