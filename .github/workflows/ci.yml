name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest ruff pip-audit

      - name: Ruff
        run: ruff check backend

      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend

  windows:
    name: Windows package build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build packaged service
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify packaged artifact
        shell: pwsh
        run: |
          if (-not (Test-Path dist/DeusCFO/DeusCFO.exe)) { throw "Packaged executable is missing" }
          if (-not (Test-Path dist/DeusCFO/SHA256SUMS.txt)) { throw "Packaged checksum is missing" }

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend dependency audit
        run: npm audit --prefix frontend --audit-level=high

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend tests
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
